<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mahjong Zen</title>
    <!--
      The CrazyGames SDK.

      A script tag from their host, which is the one documented exception to
      this project's "no external CDN" rule (see `.claude/docs/technical-preferences.md`
      and `src/platform/crazygames/sdk.ts`): CrazyGames require the SDK to be
      loaded from `sdk.crazygames.com` so it receives their fixes, and it is the
      one origin the portal's own sandbox is guaranteed to allow.

      Not `async` and not `defer`: it is a few kilobytes, and having the global
      defined before the module bundle runs means `loadCrazyGamesSdk` finds it
      on its first look rather than polling. A build served anywhere else simply
      fails to fetch it and the game runs standalone — which is exactly what
      happens on a developer's machine every day.
    -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <style>
      /* env(safe-area-inset-*) only evaluates inside CSS — there is no JS API
         for it — so it is mirrored onto four custom properties here, and
         `src/render/safeArea.ts` reads them back through getComputedStyle,
         which resolves env() to a plain pixel string. Needs viewport-fit=cover
         above, or every one of these is permanently 0.
         Falls back to 0px so a browser with no notch (i.e. no env() support
         needed) still resolves these to a real length rather than "auto". */
      :root {
        --safe-area-inset-top: env(safe-area-inset-top, 0px);
        --safe-area-inset-right: env(safe-area-inset-right, 0px);
        --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-inset-left: env(safe-area-inset-left, 0px);
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0f4030;
        overflow: hidden;
        /* Portal iframes on touch devices: stop pull-to-refresh and pinch-zoom
           from stealing taps meant for tiles. */
        overscroll-behavior: none;
        touch-action: manipulation;
        /* Required by CrazyGames' mobile technical requirements. Without it a
           press-and-drag on a tile — which is a real input mode here, see
           `dragToMatch` — raises the browser's text-selection UI over the
           board, and on Android leaves a blue wash across the canvas that no
           tap clears. All four prefixes, because the unprefixed property alone
           does not cover the WebKit and Gecko versions still in the field. */
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        /* Same family of problem: long-pressing a tile on iOS raises the
           callout menu ("Copy", "Look Up") over the board. */
        -webkit-touch-callout: none;
      }
      /* The canvas is sized by Phaser's RESIZE scale mode to match this box, so
         the box must fill the frame exactly — no flex centring, which would
         fight the canvas for the remaining space.

         Fixed + inset sizes straight off the viewport instead of inheriting
         through html/body, so the box is measurable as early as possible.
         Phaser booting against a zero-sized parent creates a 0x0 WebGL
         renderer that never recovers. */
      #game {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      #game canvas { display: block; }
    </style>
    <script type="module" crossorigin src="./assets/index-CNfS_6PI.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/phaser-bxIubX3a.js">
  </head>
  <body>
    <div id="game"></div>
  </body>
</html>
